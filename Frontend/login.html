<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundación Esperanza - Acceso</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Reutilizamos el mismo Header -->
    <header class="site-header">
        <div class="container">
            <div class="logo">Fundación Esperanza</div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="#">Quiénes Somos</a></li>
                    <li><a href="#">Contacto</a></li>
                    <li><a href="#">Servicios</a></li>
                    <li><a href="login.html" class="btn-login active">Iniciar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Sección específica de Login -->
    <main class="container login-container">
        <div class="login-card">
            <h2>Acceso a Usuarios</h2>
            
            <!-- El atributo action estará vacío por ahora, luego lo conectaremos con TypeScript -->
            <form action="#" method="POST" class="login-form">
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@fundacion.org">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
            
            <p class="login-help">¿Olvidaste tu contraseña? <a href="#">Recuperar aquí</a></p>
        </div>
    </main>

    <!-- Reutilizamos el mismo Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2023 Fundación Esperanza.</p>
        </div>
    </footer>

</body>
</html>
